<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Wish For ____</title>
    <!-- Standard Myanmar Fonts & Modern Display Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&family=Padauk:wght@400;700&family=Pyidaungsu:wght@400;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            color: #ffffff;
            font-family: 'Montserrat', 'Pyidaungsu', 'Padauk', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
            background: radial-gradient(circle at center, #2e0d16 0%, #120407 100%);
        }

        /* Canvas for Falling Hearts Background */
        #bgCanvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* FIRST PAGE: Main Card */
        .main-container {
            position: relative;
            z-index: 10;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: rgba(38, 14, 21, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 28px;
            border: 1px solid rgba(255, 183, 197, 0.12);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6), 0 0 40px rgba(217, 70, 110, 0.15);
            width: 100%;
            max-width: 420px;
            padding: 42px 30px;
            text-align: center;
        }

        .card h1.title {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 3px;
            color: #f7d6e0;
            margin-bottom: 6px;
            text-shadow: 0 0 12px rgba(247, 214, 224, 0.3);
        }

        .card .subtitle {
            font-size: 14px;
            font-weight: 400;
            letter-spacing: 4px;
            color: #b38090;
            margin-bottom: 32px;
        }

        .countdown-box {
            background: rgba(18, 6, 10, 0.6);
            border: 1px solid rgba(255, 182, 193, 0.12);
            border-radius: 14px;
            padding: 16px 20px;
            font-family: 'Montserrat', monospace;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 2px;
            color: #ff758f;
            margin-bottom: 28px;
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.5);
        }

        .unlock-btn {
            width: 100%;
            padding: 16px;
            border-radius: 30px;
            border: none;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .unlock-btn:disabled {
            background: rgba(255, 255, 255, 0.15);
            color: rgba(255, 255, 255, 0.4);
            cursor: not-allowed;
        }

        .unlock-btn:not(:disabled) {
            background: linear-gradient(135deg, #ff4d6d, #c9184a);
            color: #ffffff;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(255, 77, 109, 0.4);
        }

        .unlock-btn:not(:disabled):hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(255, 77, 109, 0.6);
        }

        /* SECOND PAGE / MODAL SCREEN */
        .modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(14, 4, 7, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 1;
            transition: opacity 0.4s ease;
        }

        .hidden {
            display: none !important;
        }

        /* Scattered Polaroids on 2nd Page (No hanging strings) */
        .polaroid-wrapper {
            position: absolute;
            width: 100%; height: 100%;
            top: 0; left: 0;
            pointer-events: none;
            z-index: 1;
        }

        .polaroid {
            position: absolute;
            background: #ffffff;
            padding: 10px 10px 35px 10px;
            border-radius: 4px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            width: 150px;
            height: 185px;
            transition: transform 0.3s ease;
        }

        .polaroid .photo {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            border-radius: 2px;
        }

        /* Fixed positions for polaroids on modal screen */
        .p1 { top: 8%; left: 8%; transform: rotate(-7deg); }
        .p2 { top: 10%; right: 8%; transform: rotate(6deg); }
        .p3 { bottom: 8%; left: 10%; transform: rotate(5deg); }
        .p4 { bottom: 10%; right: 10%; transform: rotate(-8deg); }

        /* Modal Inner Content Card */
        .modal-card {
            position: relative;
            z-index: 10;
            background: rgba(35, 12, 19, 0.92);
            border: 1px solid rgba(255, 183, 197, 0.2);
            border-radius: 24px;
            width: 90%;
            max-width: 400px;
            padding: 35px 25px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
        }

        .sparkle-icon {
            font-size: 38px;
            margin-bottom: 12px;
            display: inline-block;
            filter: drop-shadow(0 0 10px #ff4d6d);
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.12); }
        }

        .modal-title {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 4px;
            color: #ffffff;
            margin-bottom: 20px;
        }

        .msg-box {
            min-height: 100px;
            margin-bottom: 25px;
            padding: 0 10px;
        }

        #surpriseMsg {
            font-family: 'Pyidaungsu', 'Padauk', sans-serif;
            font-size: 15px;
            line-height: 2.1;
            color: #fce4ec;
            text-align: center;
            word-break: break-word;
        }

        .close-btn {
            background: transparent;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 10px 36px;
            border-radius: 25px;
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .close-btn:hover {
            background: #ffffff;
            color: #120407;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .polaroid {
                width: 110px;
                height: 140px;
                padding: 6px 6px 25px 6px;
                opacity: 0.5;
            }
            .p1 { top: 4%; left: 3%; }
            .p2 { top: 5%; right: 3%; }
            .p3 { bottom: 4%; left: 3%; }
            .p4 { bottom: 5%; right: 3%; }
        }
    </style>
</head>
<body>

    <!-- Canvas for Falling Hearts Effect -->
    <canvas id="bgCanvas"></canvas>

    <!-- Background Music -->
    <audio id="bgMusic" loop preload="auto">
        <source src="birthday_song.mp3" type="audio/mpeg">
    </audio>

    <!-- FIRST PAGE -->
    <div class="main-container">
        <div class="card">
            <h1 class="title">HAPPY BIRTHDAY</h1>
            <div class="subtitle"> 
                ——
            </div>
            
            <div id="timer-display" class="countdown-box">
                00D : 00H : 00M : 00S
            </div>

            <button id="runBtn" class="unlock-btn" onclick="runSurprise()" disabled>
                UNLOCK SURPRISE
            </button>
        </div>
    </div>

    <!-- SECOND PAGE (Modal with scattered polaroid photos, NO hanging strings) -->
    <div id="modal" class="modal hidden">
        <div class="polaroid-wrapper">
            <div class="polaroid p1">
                <div class="photo" style="background-image: url('photo1.jpg');"></div>
            </div>
            <div class="polaroid p2">
                <div class="photo" style="background-image: url('photo2.jpg');"></div>
            </div>
            <div class="polaroid p3">
                <div class="photo" style="background-image: url('photo3.jpg');"></div>
            </div>
            <div class="polaroid p4">
                <div class="photo" style="background-image: url('photo4.jpg');"></div>
            </div>
        </div>

        <div class="modal-card">
            <div class="sparkle-icon">💖</div>
            <h2 class="modal-title">DEAR EAINT</h2>
            
            <div class="msg-box">
                <p id="surpriseMsg"></p>
            </div>

            <button class="close-btn" onclick="closeModal()">Close</button>
        </div>
    </div>

    <script>
        // Target Date Countdown Timer (September 17, 2026 Midnight)
        const targetDate = new Date("2026-09-17T00:00:00").getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const difference = targetDate - now;

            const timerDisplay = document.getElementById("timer-display");
            const runBtn = document.getElementById("runBtn");

            if (!timerDisplay || !runBtn) return;

            if (difference > 0) {
                const days = Math.floor(difference / (1000 * 60 * 60 * 24));
                const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((difference % (1000 * 60)) / 1000);

                const d = String(days).padStart(2, '0');
                const h = String(hours).padStart(2, '0');
                const m = String(minutes).padStart(2, '0');
                const s = String(seconds).padStart(2, '0');

                timerDisplay.innerText = `${d}D : ${h}H : ${m}M : ${s}S`;
                runBtn.disabled = true;
            } else {
                timerDisplay.innerText = "✨ HAPPY BIRTHDAY ✨\n\n EAINT HMUE KYAW! ";
                timerDisplay.style.color = "#ffb7c5";
                runBtn.disabled = false;
            }
        }

        updateCountdown();
        setInterval(updateCountdown, 1000);

        // Falling Hearts Canvas Animation Engine
        const canvas = document.getElementById('bgCanvas');
        if (canvas) {
            const ctx = canvas.getContext('2d');
            let hearts = [];

            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            class HeartParticle {
                constructor() {
                    this.reset(true);
                }

                reset(initial = false) {
                    this.x = Math.random() * canvas.width;
                    this.y = initial ? Math.random() * canvas.height : -30;
                    this.size = Math.random() * 12 + 8;
                    this.speedY = Math.random() * 1.5 + 0.8; // Falling speed
                    this.sway = Math.random() * Math.PI * 2;
                    this.swaySpeed = Math.random() * 0.02 + 0.01;
                    this.opacity = Math.random() * 0.6 + 0.25;
                    this.rotation = Math.random() * Math.PI * 2;
                    this.rotationSpeed = (Math.random() - 0.5) * 0.02;

                    const colors = ['#ff4d6d', '#ff758f', '#ffb7c5', '#ff8fa3', '#ffffff'];
                    this.color = colors[Math.floor(Math.random() * colors.length)];
                }

                update() {
                    this.y += this.speedY;
                    this.sway += this.swaySpeed;
                    this.x += Math.sin(this.sway) * 0.7; // Side-to-side falling sway
                    this.rotation += this.rotationSpeed;

                    if (this.y > canvas.height + 30) {
                        this.reset(false);
                    }
                }

                draw() {
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.rotate(this.rotation);
                    ctx.globalAlpha = this.opacity;
                    ctx.fillStyle = this.color;

                    ctx.beginPath();
                    const s = this.size;
                    ctx.moveTo(0, s * 0.3);
                    ctx.bezierCurveTo(0, 0, -s / 2, 0, -s / 2, s * 0.3);
                    ctx.bezierCurveTo(-s / 2, s, 0, s * 1.3, 0, s * 1.5);
                    ctx.bezierCurveTo(0, s * 1.3, s / 2, s, s / 2, s * 0.3);
                    ctx.bezierCurveTo(s / 2, 0, 0, 0, 0, s * 0.3);
                    ctx.closePath();
                    ctx.fill();

                    ctx.restore();
                }
            }

            // Create 45 falling hearts
            for (let i = 0; i < 45; i++) {
                hearts.push(new HeartParticle());
            }

            function animateHearts() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                hearts.forEach(h => {
                    h.update();
                    h.draw();
                });
                requestAnimationFrame(animateHearts);
            }
            animateHearts();
        }

        // UNICODE GRAPHEME TYPEWRITER (Prevents Myanmar font scrambling glitch)
        function typeWriterMyanmar(element, text, speed = 60) {
            element.innerText = "";
            
            let clusters = [];
            if (typeof Intl !== 'undefined' && Intl.Segmenter) {
                const segmenter = new Intl.Segmenter('my', { granularity: 'grapheme' });
                clusters = Array.from(segmenter.segment(text), s => s.segment);
            } else {
                clusters = Array.from(text);
            }

            let index = 0;
            function step() {
                if (index < clusters.length) {
                    element.innerText += clusters[index];
                    index++;
                    setTimeout(step, speed);
                }
            }
            step();
        }

        // Open Surprise Page
        function runSurprise() {
            const modal = document.getElementById('modal');
            const msg = document.getElementById('surpriseMsg');
            const music = document.getElementById('bgMusic');

            if (modal) modal.classList.remove('hidden');

            if (music) {
                music.currentTime = 0;
                music.play().catch(e => console.log("Audio play error: ", e));
            }

            const wishText = "EAINT ရေ... မွေးနေ့မှာ အစစအရာရာ အဆင်ပြေပါစေ။ လိုအင်ဆန္ဒတွေ ပြည့်ဝပြီး ပျော်ရွှင်ရတဲ့ Developer ကြီး ဖြစ်ပါစေ။ အချစ်များစွာဖြင့်... ဟက်ပီးမွေးနေ့ပါဗျာ! 💖🎂🎉🌸";
            
            if (msg) {
                typeWriterMyanmar(msg, wishText, 55);
            }
        }

        function closeModal() {
            const modal = document.getElementById('modal');
            if (modal) modal.classList.add('hidden');

            const music = document.getElementById('bgMusic');
            if (music) music.pause();
        }
    </script>
</body>
</html>
